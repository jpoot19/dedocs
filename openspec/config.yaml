schema: spec-driven

context: |
  dedocs is a TypeScript/React document editor project using Tiptap,
  tsup, and pnpm workspaces. No dependencies installed yet — empty seed repo.
  Vitest will be added during initial project setup.

strict_tdd: false

# Testing capabilities are detected/resolved during setup.
# Will be populated once Vitest is configured.
# For now: not available (no package.json exists).
testing: {}

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
