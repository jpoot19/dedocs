schema: spec-driven

context: |
  dedocs is a TypeScript/React monorepo (pnpm workspaces) for paged
  document editing built on Tiptap 3. Primary library in packages/dedocs/
  with Vite playground. tsup 8 builds ESM+CJS. Strict TypeScript (strict: true).
  Testing: Vitest 2 (unit with happy-dom) + Playwright 1.45 (E2E).
  No linter/formatter configured.

strict_tdd: false

testing:
  runner: vitest 2.0
  runner_command: pnpm --filter dedocs test
  coverage: false
  layers:
    unit: vitest + @testing-library/react + happy-dom
    integration: false
    e2e: "@playwright/test 1.45 (chromium, workspace playground)"
  e2e_command: pnpm --filter dedocs test:e2e
  quality:
    typecheck: pnpm --filter dedocs typecheck
    linter: false
    formatter: false

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: pnpm --filter dedocs test
  verify:
    test_command: pnpm --filter dedocs test
    build_command: pnpm --filter dedocs build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
